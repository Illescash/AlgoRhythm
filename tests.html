<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>AlgoRhythm · Banco de pruebas</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      body { font-family: Inter, sans-serif; background:#0f1115; color:#e8eaed; margin:0; padding:32px; }
      h1 { font-size:22px; margin:0 0 8px; }
      h2 { font-size:16px; margin:24px 0 8px; color:#9aa3b2; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
      .grid { display:grid; grid-template-columns: 1fr 1fr; gap:24px; max-width:1200px; }
      .card { background:#161a22; border:1px solid #242a36; border-radius:10px; padding:20px; }
      button { background:#3b82f6; color:white; border:0; border-radius:6px; padding:10px 16px; font-weight:600; cursor:pointer; font-family:inherit; }
      button:disabled { opacity:.5; cursor:wait; }
      table { width:100%; border-collapse:collapse; margin-top:14px; font-family:'JetBrains Mono', monospace; font-size:13px; }
      th, td { padding:7px 10px; text-align:left; border-bottom:1px solid #242a36; }
      th { color:#9aa3b2; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
      .ok { color:#22c55e; font-weight:700; }
      .fail { color:#ef4444; font-weight:700; }
      .meta { color:#9aa3b2; font-size:12px; margin-top:8px; }
      .num { text-align:right; }
      .pass-banner { margin-top:14px; padding:10px 14px; border-radius:6px; font-weight:600; }
      .pass-banner.ok { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); color:#22c55e; }
      .pass-banner.fail { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#ef4444; }
    </style>
  </head>
  <body>
    <h1>AlgoRhythm — Tests</h1>

    <div class="grid">
      <div class="card">
        <h2>Corrección de algoritmos</h2>
        <button id="run-correctness">Ejecutar</button>
        <div id="correctness-output"></div>
      </div>

      <div class="card">
        <h2>Validación del DataProxy</h2>
        <button id="run-proxy">Ejecutar</button>
        <div id="proxy-output"></div>
      </div>
    </div>

    <script type="module" src="/src/tests/runTests.ts"></script>
  </body>
</html>
